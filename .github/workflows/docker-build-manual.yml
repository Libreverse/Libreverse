name: Docker build (manual)

# DIAGNOSTIC COPY, never to be merged. Dispatched from a branch to find out why
# `docker build` is killed during `exporting layers` on the deploy runner.
# It has NO B2 secrets (the Dockerfile skips the upload/prune and the image strip without them),
# NO Quay login, NO push and NO deploy steps, so it cannot touch production or the asset bucket.

on:
  workflow_dispatch:
    inputs:
      push_to_quay:
        description: ignored in this diagnostic copy
        type: boolean
        default: false
      deploy:
        description: ignored in this diagnostic copy
        type: boolean
        default: false
      run_smoke:
        description: ignored in this diagnostic copy
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  baseline:
    name: A - docker build (docker driver) + sampler
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Build with resource sampler and live kernel log
        env:
          DOCKER_BUILDKIT: "1"
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_USERNAME: ${{ secrets.TIDB_USERNAME }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
        run: |
          set -uo pipefail
          echo "runner: $(nproc) cpu, $(free -m | awk 'NR==2{print $2}') MB RAM"; df -h /; docker version --format 'docker {{.Server.Version}}'; docker info 2>/dev/null | grep -iE "storage driver|driver|containerd|cgroup" | head -6
          sample() { while true; do
            echo "[sampler $(date -u +%T)] $(free -m | awk 'NR==2{printf "mem used=%sMB avail=%sMB", $3, $7}') | $(df -h / | awk 'NR==2{print "disk avail=" $4}') | top: $(ps -eo rss,comm --sort=-rss | sed -n 2,5p | awk '{printf "%s=%dMB ", $2, $1/1024}')"
            sleep 15
          done; }
          sample & SPID=$!
          sudo dmesg -wT 2>/dev/null | sed -u 's/^/[dmesg] /' & DPID=$!
          start=$(date +%s)
          docker build \
            --secret id=tidb_host,env=TIDB_HOST \
            --secret id=tidb_username,env=TIDB_USERNAME \
            --secret id=tidb_password,env=TIDB_PASSWORD \
            -t diag/libreverse:baseline . ; rc=$?
          echo "docker build exit code: $rc after $(( $(date +%s) - start ))s"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -3 || true
          kill $SPID $DPID 2>/dev/null || true
          exit $rc

  oci-export:
    name: B - buildx (docker-container driver) exporting an OCI tarball + sampler
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Build with resource sampler and live kernel log
        env:
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_USERNAME: ${{ secrets.TIDB_USERNAME }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
        run: |
          set -uo pipefail
          echo "runner: $(nproc) cpu, $(free -m | awk 'NR==2{print $2}') MB RAM"; df -h /
          docker buildx create --name diag --driver docker-container --use >/dev/null
          docker buildx inspect --bootstrap | grep -iE "^Name|Driver|Version" | head -4
          sample() { while true; do
            echo "[sampler $(date -u +%T)] $(free -m | awk 'NR==2{printf "mem used=%sMB avail=%sMB", $3, $7}') | $(df -h / | awk 'NR==2{print "disk avail=" $4}') | top: $(ps -eo rss,comm --sort=-rss | sed -n 2,5p | awk '{printf "%s=%dMB ", $2, $1/1024}')"
            sleep 15
          done; }
          sample & SPID=$!
          sudo dmesg -wT 2>/dev/null | sed -u 's/^/[dmesg] /' & DPID=$!
          start=$(date +%s)
          docker buildx build \
            --secret id=tidb_host,env=TIDB_HOST \
            --secret id=tidb_username,env=TIDB_USERNAME \
            --secret id=tidb_password,env=TIDB_PASSWORD \
            --output type=oci,dest=/tmp/libreverse.oci.tar \
            . ; rc=$?
          echo "buildx exit code: $rc after $(( $(date +%s) - start ))s"
          ls -lh /tmp/libreverse.oci.tar 2>/dev/null || true
          kill $SPID $DPID 2>/dev/null || true
          exit $rc
